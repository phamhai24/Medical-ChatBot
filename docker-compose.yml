services:
  # ─── FastAPI Backend ────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical-rag-api
    ports:
      - "${API_PORT:-8000}:8000"
    # Real secrets/config (API_GENERATOR_PROVIDER, API_GENERATOR_MODEL, ADMIN_API_KEY,
    # OPENAI_API_KEY, GROQ_API_KEY, ANTHROPIC_API_KEY, GENERATOR_MODE, ...) come straight from
    # this file — not compose-level ${VAR} substitution, which would need a .env next to this
    # docker-compose.yml (there isn't one; backend/.env is backend-local, same as backend/'s own
    # requirements.txt/Dockerfile).
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app

      # API
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=false
      - API_CORS_ORIGINS=["http://localhost:${WEB_PORT:-3000}"]

      # Redis
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0

      # RAG
      # Models come from the read-only host cache above, so never hit the network for them.
      # Set HF_HUB_OFFLINE=0 in your shell if a model is not cached yet and must be downloaded
      # (that needs a writable cache, i.e. run the backend natively once to fetch it).
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - EMBEDDING_MODEL=BAAI/bge-m3
      - EMBEDDING_DEVICE=cuda
      - VECTOR_STORE_TYPE=chroma
      - VECTOR_STORE_PATH=/app/data/vectorstore
      - VECTOR_STORE_COLLECTION=medical_qa
      - RETRIEVAL_TOP_K=5

      # Logging
      - LOG_LEVEL=INFO
      - LOG_JSON=false
      - LOG_FILE=/app/logs/app.log

    volumes:
      # Named volume, not a Windows bind-mount: vectorstore/bm25_index reads go
      # through WSL2's native ext4 instead of bridging to NTFS, which used to add
      # 100s+ to warm-up (Chroma document count, BM25 index load). Re-ingest from
      # inside this container (see scripts/docker_ingest.ps1) so results land
      # straight in the volume — ingesting on the host writes to backend/data/
      # instead and won't be picked up here without copying it in again.
      - medical_data:/app/data
      - ./backend/logs:/app/logs
      - ./backend/config:/app/config
      # Share the host's HuggingFace cache instead of keeping a second ~4.4GB copy in a
      # Docker volume (which lives inside docker_data.vhdx and never shrinks by itself).
      # Read-only: the container only reads bge-m3 / bge-reranker-v2-m3. Override the
      # path with HF_CACHE_DIR if your cache is elsewhere.
      - ${HF_CACHE_DIR:-${USERPROFILE:-${HOME}}/.cache/huggingface}:/home/appuser/.cache/huggingface:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medical-rag-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── React Frontend ──────────────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medical-rag-web
    ports:
      - "${WEB_PORT:-3000}:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  medical_data:
    external: true
    name: medical_rag_chatbot_data

networks:
  default:
    name: medical-rag-network
