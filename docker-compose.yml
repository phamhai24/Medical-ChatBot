version: "3.9"

services:
  # ─── FastAPI Backend ────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical-rag-api
    ports:
      - "${API_PORT:-8000}:8000"
    # Real secrets/config (API_GENERATOR_PROVIDER, API_GENERATOR_MODEL, ADMIN_API_KEY,
    # OPENAI_API_KEY, GROQ_API_KEY, ANTHROPIC_API_KEY, GENERATOR_MODE, ...) come straight from
    # this file — not compose-level ${VAR} substitution, which would need a .env next to this
    # docker-compose.yml (there isn't one; backend/.env is backend-local, same as backend/'s own
    # requirements.txt/Dockerfile).
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app

      # API
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_CORS_ORIGINS=["http://localhost:${WEB_PORT:-3000}"]

      # Redis
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0

      # RAG
      - EMBEDDING_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - EMBEDDING_DEVICE=cpu
      - VECTOR_STORE_TYPE=chroma
      - VECTOR_STORE_PATH=/app/data/vectorstore
      - VECTOR_STORE_COLLECTION=medical_qa
      - RETRIEVAL_TOP_K=5

      # Logging
      - LOG_LEVEL=INFO
      - LOG_JSON=false
      - LOG_FILE=/app/logs/app.log

    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
      - ./backend/config:/app/config
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medical-rag-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── React Frontend ──────────────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medical-rag-web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:

networks:
  default:
    name: medical-rag-network
