# RAG Configuration for Medical Chatbot

rag:
  # Data settings
  data:
    input_path: "data/processed/data.json"
    chunk_size: 512
    chunk_overlap: 64
    min_chunk_length: 50

  # Embedding settings (documentation-only here, like the vector_store/retrieval
  # blocks below — see the NOTE further down; real value is EMBEDDING_MODEL in .env)
  embedding:
    model_name: "BAAI/bge-m3"  # retrieval-optimized multilingual, covers Vietnamese
    # model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"  # old default, general similarity not retrieval-tuned
    batch_size: 32
    device: "cuda"  # "cuda" or "cpu"
    normalize_embeddings: true
    max_length: 512

  # Vector store settings
  vector_store:
    type: "chroma"  # "chroma", "faiss", "milvus"
    persist_directory: "data/vectorstore"
    collection_name: "medical_qa"
    # NOTE: this "vector_store" block (like "retrieval"/"embedding"/"generation" below) is NOT
    # actually read by src/utils/config_loader.py — only "rag.prompt" is loaded from this YAML
    # file; everything else comes from Settings/.env (see src/core/config.py). The real search
    # mode is controlled by the VECTOR_SEARCH_TYPE env var (currently "hybrid" in .env). Kept
    # here for documentation only; edit .env / Settings defaults to actually change behavior.
    search_type: "hybrid"  # "similarity" or "hybrid" (vector + BM25). "mmr" was set here
                            # previously but Retriever never implements an "mmr" branch, so it
                            # would have silently fallen back to plain top-k similarity search
                            # even if this block were read.
    fetch_k: 20
    lambda_mult: 0.5  # For MMR diversity control

  # Retrieval settings (also documentation-only here, see note above; real defaults are the
  # retrieval_rerank_* Settings fields / RETRIEVAL_RERANK_* env vars in src/core/config.py)
  retrieval:
    top_k: 5
    score_threshold: 0.3  # Minimum similarity score
    rerank_enabled: true
    rerank_model: "BAAI/bge-reranker-v2-m3"  # multilingual cross-encoder, covers Vietnamese
    rerank_fetch_k: 20  # candidates to rerank before cutting to top_k

  # Generation settings
  generation:
    model_name: "Qwen/Qwen2.5-7B-Instruct"
    # model_name: "microsoft/Phi-3-mini-128k-instruct"  # Alternative
    # model_name: "mistralai/Mistral-7B-Instruct-v0.2"  # Alternative
    max_new_tokens: 512
    temperature: 0.3
    top_p: 0.9
    top_k: 50
    do_sample: true
    repetition_penalty: 1.1
    streaming: true

  # Prompt template
  prompt:
    system: |
      Bạn là trợ lý y tế chuyên nghiệp. Nhiệm vụ của bạn là trả lời câu hỏi của người dùng
      dựa trên thông tin được cung cấp trong ngữ cảnh (context) bên dưới.

      HƯỚNG DẪN QUAN TRỌNG:
      - Chỉ trả lời dựa trên thông tin có trong ngữ cảnh. Không bịa đặt thông tin.
      - Nếu ngữ cảnh không chứa thông tin để trả lời câu hỏi, hãy nói rõ rằng bạn không tìm thấy thông tin đó trong dữ liệu được cung cấp.
      - Trả lời bằng tiếng Việt, rõ ràng và dễ hiểu.
      - Nếu câu hỏi yêu cầu thông tin y tế chuyên môn, hãy trình bày logic và chi tiết.
      - Luôn nhắc nhở người dùng tham khảo ý kiến bác sĩ cho các quyết định y tế quan trọng.
      - Không đưa ra chẩn đoán y khoa cụ thể cho cá nhân.
      - Nếu người dùng hỏi liều lượng thuốc cụ thể dựa trên thông tin cá nhân của họ (cân nặng, tuổi, tình trạng bệnh...), KHÔNG tính toán hay đưa ra một con số liều lượng cụ thể nào, dù bạn có kiến thức chung về liều tham khảo. Chỉ nói rằng liều dùng cần được bác sĩ hoặc dược sĩ chỉ định dựa trên tình trạng thực tế.
      - Nếu người dùng hỏi tiên lượng sống, thời gian còn lại, hoặc mức độ nghiêm trọng cụ thể cho tình trạng cá nhân của họ, KHÔNG đưa ra con số thời gian hay tỷ lệ phần trăm cụ thể nào, dù có thống kê chung. Chỉ khuyên họ trao đổi trực tiếp với bác sĩ điều trị, người hiểu đầy đủ bệnh sử của họ.
      - Nếu câu hỏi có ghi "(Chủ đề đang trao đổi: ...)", chỉ trả lời về đúng chủ đề đó. Bỏ qua các đoạn ngữ cảnh nói về bệnh, thuốc hay vấn đề khác. Nếu không đoạn nào nói về chủ đề đó, trả lời rằng không tìm thấy thông tin về chủ đề đó trong dữ liệu; tuyệt đối không trả lời về một bệnh khác thay thế.
      - Ngữ cảnh được đánh số [1], [2], [3]... Sau MỖI câu hoặc ý bạn viết dựa trên một đoạn ngữ cảnh cụ thể, thêm số đó ngay sau, ví dụ: "...triệu chứng bao gồm sốt và ho [1]." Nếu một câu dựa trên nhiều đoạn, ghi tất cả, ví dụ [1][3]. Chỉ đánh số đoạn bạn THỰC SỰ dùng — không đánh số đoạn không liên quan chỉ vì nó có trong ngữ cảnh. Nếu không đoạn nào trong ngữ cảnh liên quan, đừng đánh số gì cả.

    user_template: |
      Ngữ cảnh (Context):
      {context}

      Câu hỏi: {question}

      Trả lời:

  # Fallback (when retrieval fails)
  fallback:
    enabled: true
    model_name: "Qwen/Qwen2.5-7B-Instruct"

# API settings
api:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:8501"
    - "http://localhost:3000"
  reload: true

# Web UI settings
web:
  title: "Chatbot Y tế - RAG"
  icon: "🏥"
  description: "Trợ lý y tế sử dụng RAG"
  page_layout: "wide"
