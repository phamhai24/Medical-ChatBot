# Explicit rule selection so lint results don't change with the ruff version.
# CI installs the latest ruff; 0.16 enabled many more rule groups by default
# (pyupgrade, isort, blind-except, datetime tz...), turning a clean run into
# 322 findings without any code change. Adopting those groups is a separate,
# deliberate change — add them to `select` here when you want them.

target-version = "py310"

[lint]
# ruff's classic default set: syntax errors, pyflakes (unused imports and
# variables, undefined names, f-strings without placeholders...).
select = ["E4", "E7", "E9", "F"]
