name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─── Backend Lint & Type Check ──────────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install linting tools
        run: |
          pip install ruff mypy

      - name: Run ruff
        run: |
          ruff check src/ tests/ --output-format=github

      - name: Run mypy
        run: |
          mypy src/ --ignore-missing-imports --follow-imports=silent || true

  # ─── Backend Unit & Integration Tests ───────────────────────────────────────
  backend-test:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests
        env:
          # No model downloads in CI: tests that touch the embedder (e.g. /health)
          # fail fast offline instead of pulling bge-m3 (~2.2 GB). Live-LLM tests
          # skip themselves without an API key.
          HF_HUB_OFFLINE: "1"
        run: |
          # Floor just under the current total (~53%); raise it as tests are added.
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-fail-under=50

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false

  # ─── Frontend Type Check & Build ────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          npm install

      - name: Type check & build
        run: |
          npm run build

  # ─── Docker Build ───────────────────────────────────────────────────────────
  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image
        run: |
          docker build -t medical-rag-backend:test ./backend

      - name: Build Frontend Docker image
        run: |
          docker build -t medical-rag-frontend:test ./frontend

      - name: Run health check on backend
        # Liveness only: the image must start and serve HTTP. CI has no models,
        # vectorstore or API keys, so warm-up (which loads ~4 GB of models and
        # the local generator) is disabled; /health then answers 200 with the
        # components reported as unavailable.
        run: |
          docker run -d --name test-app \
            -e API_WARMUP_ENABLED=false -e GENERATOR_MODE=api \
            -e API_RELOAD=false -e HF_HUB_OFFLINE=1 \
            medical-rag-backend:test
          for i in $(seq 1 30); do
            if docker exec test-app curl -sf http://localhost:8000/health > /dev/null; then
              echo "API responded after ~$((i * 2))s"
              docker stop test-app
              exit 0
            fi
            sleep 2
          done
          docker logs test-app
          exit 1
