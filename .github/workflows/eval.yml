name: Evaluation

on:
  push:
    branches: [master, main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_llm_judge:
        description: "Run LLM-as-Judge evaluation"
        required: false
        default: "false"
        type: boolean

env:
  PYTHON_VERSION: "3.11"
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  # ─── Ingest Data ───────────────────────────────────────────────────────────
  ingest:
    name: Ingest Data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check data file
        run: |
          ls -lh data/processed/data.json || echo "Data file not present in repo"

      - name: Ingest data
        if: always()
        run: |
          python scripts/ingest_data.py --rebuild || echo "Ingestion skipped"

  # ─── Run Evaluation ─────────────────────────────────────────────────────────
  evaluate:
    name: Run Evaluation
    runs-on: ubuntu-latest
    needs: ingest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Evaluation
        run: |
          python scripts/run_eval.py --output reports/ --format html --format csv

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: backend/reports/

      - name: Post to PR
        if: github.event_name == 'pull_request'
        run: |
          REPORT_PATH="reports/eval_report_latest.html"
          if [ -f "$REPORT_PATH" ]; then
            echo "## Evaluation Results" >> $GITHUB_STEP_SUMMARY
            echo "Evaluation report generated: $REPORT_PATH" >> $GITHUB_STEP_SUMMARY
          fi

  # ─── Run LLM Judge (optional) ───────────────────────────────────────────────
  llm-judge:
    name: LLM-as-Judge Evaluation
    runs-on: ubuntu-latest
    needs: ingest
    defaults:
      run:
        working-directory: backend
    if: github.event_name == 'workflow_dispatch' && inputs.run_llm_judge == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Evaluation with LLM Judge
        run: |
          python scripts/run_eval.py --output reports/ --llm-judge --use-api-judge

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: llm-judge-reports
          path: backend/reports/
